<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cline Models</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --border: #262b38;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --accent-2: #35c28f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 48px 24px 64px; }
  h1 { font-size: 30px; margin-bottom: 28px; }
  h2 { font-size: 22px; margin-bottom: 18px; }
  ol.models { list-style: none; }
  ol.models li {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 14px;
    transition: border-color 0.15s;
  }
  ol.models li:hover { border-color: var(--accent-2); }
  ol.models .rank {
    color: var(--muted);
    font-family: Consolas, monospace;
    font-size: 14px;
    width: 28px;
    text-align: right;
  }
  ol.models .name { font-weight: 600; font-size: 17px; flex: 1; }
  ol.models .score {
    color: var(--accent-2);
    font-family: Consolas, monospace;
    font-size: 15px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Cline Models</h1>
  <h2>Models</h2>
  <ol class="models" id="models"></ol>
</div>

<script>
  // Fallback embutido (última execução do app), caso data.json não esteja disponível.
  const FALLBACK = {
    "models": [
      {"name": "Muse Spark 1.3", "score": 48.1},
      {"name": "Kimi K3", "score": 43.6},
      {"name": "GLM 5.3 Flash", "score": 41.8},
      {"name": "DeepSeek V4.1 Flash", "score": 39.5}
    ]
  };

  function render(data) {
    const list = document.getElementById("models");
    list.innerHTML = "";
    (data.models || []).forEach((model, i) => {
      const li = document.createElement("li");
      const rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = (i + 1) + ".";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = model.name;
      const score = document.createElement("span");
      score.className = "score";
      score.textContent = model.score != null ? "Intelligence " + model.score : "";
      li.append(rank, name, score);
      list.appendChild(li);
    });
  }

  fetch("data.json")
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(render)
    .catch(() => render(FALLBACK));
</script>
</body>
</html>
