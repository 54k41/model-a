name: Atualiza lista de modelos free

on:
  schedule:
    # duas vezes ao dia: 09:00 e 21:00 UTC
    - cron: "0 9,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Roda o app e regenera data.json
        run: python main.py --json > data.json

      - name: Commit e push se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data.json; then
            echo "Lista sem mudanças."
          else
            git add data.json
            git commit -m "Atualiza data.json (modelos free) - $(date -u +%Y-%m-%d)"
            git push
          fi
